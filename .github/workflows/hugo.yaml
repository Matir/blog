# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
      - current
      - tryhugo # Added for testing
      - draft

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.2
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: '1.26'

      - name: Cache Hugo resources
        uses: actions/cache@v5
        with:
          path: resources
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('resources/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Setup Tools (mise)
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      - name: Install Dart Sass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OS=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          echo "Downloading Dart Sass for $OS-$ARCH..."
          gh release download --repo sass/dart-sass --pattern "*$OS-$ARCH.tar.gz" --output "${RUNNER_TEMP}/sass.tar.gz"
          mkdir -p "$HOME/.local/share"
          tar -xf "${RUNNER_TEMP}/sass.tar.gz" -C "$HOME/.local/share"
          echo "$HOME/.local/share/dart-sass" >> $GITHUB_PATH

      - name: Verify Tools
        run: |
          ls -al $(which hugo) $(which sass)
          hugo env
          sass --version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Cache Hugo Mods
        uses: actions/cache@v5
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build with Hugo
        id: hugobuild
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: UTC
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Link Checker (Lychee)
        run: |
          lychee --offline --root-dir "$GITHUB_WORKSPACE/public" "$GITHUB_WORKSPACE/public/**/*.html"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/current'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ./public

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/current'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
